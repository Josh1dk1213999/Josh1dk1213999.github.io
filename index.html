<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Joshua Guambana's personal college workspace portfolio and showcase hub.">
    <title>Joshua Guambana</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f6fa;
        color: #17243b;
        font-family: system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 680px;
        padding: clamp(28px, 6vw, 64px);
        border-top: 5px solid #bd2438;
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 12px 40px #17243b12;
      }
      h1 { margin: 0 0 20px; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.15; }
      p { margin: 0; color: #46536a; font-size: 1.125rem; line-height: 1.7; }
    </style>
  </head>
  <body>
    <main>
      <h1>Joshua Guambana</h1>
      <p>I am a Freshman student at NJIT and this is my personal college workspace portfolio and showcase hub.</p>
    </main>
  </body>
</html>
